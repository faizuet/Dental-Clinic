# Production overrides. Use with the base file so the existing Postgres and
# uploads volumes stay in place:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: nabi-dental-backend

services:
  app:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: production
      DEBUG: "false"
