name: nabi_dental_app
description: Nabi Dental Clinic management app for laptop and desktop.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/app_icon.png
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#2F80ED"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#F3F7FF"
    theme_color: "#2F80ED"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/brand/clinic_portrait.jpg
